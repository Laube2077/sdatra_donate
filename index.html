<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【公式】特撮映画制作支援プロジェクト</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 800px; margin: 0 auto; background-color: #333; padding: 30px; border-radius: 10px; }
        .video-placeholder { width: 100%; height: 400px; background-color: #000; border: 2px dashed #666; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; color: #888; }
        h1 { color: #e50914; }
        .amount { font-size: 3em; font-weight: bold; color: #4CAF50; margin: 20px 0; }
        .donate-btn { background-color: #e50914; color: white; border: none; padding: 15px 40px; font-size: 1.5em; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .donate-btn:hover { background-color: #ff1a26; transform: scale(1.05); }
        .note { font-size: 0.8em; color: #aaa; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>シンスダトラマン・寄付のお願い</h1>
        
        <div class="video-placeholder">
            予告編を置く
        </div>

        <p>あなたの支援で、須田のCGクオリティが上がります！</p>
        
        <div>
            <p>現在の支援総額</p>
            <div class="amount" id="totalAmount">¥0</div>
        </div>

        <button class="donate-btn" onclick="donate()">
            1,000円 支援する
        </button>

        <p class="note">※これはサーバー構築練習用のジョークサイトです。実際の決済は行われません。</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        
        const SUPABASE_URL = 'https://gdizyqtxpvslegfyfkua.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ABxC_cgy7ynTw0YhjUzlxQ_wOgOaidV';

        // データベースへの接続準備
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Supabaseから現在の金額を取得して画面に表示する関数
        async function fetchTotal() {
            const { data, error } = await supabase.from('funding').select('total').eq('id', 1).single();
            if (data) {
                document.getElementById('totalAmount').innerText = '¥' + data.total.toLocaleString();
                return data.total;
            }
            return 0;
        }

        // ボタンが押されたときの処理
        async function donate() {
            // 今の金額を取得して、1000円足す
            const currentTotal = await fetchTotal();
            const newTotal = currentTotal + 1000;

            // Supabaseの数字を新しい金額で上書きする
            await supabase.from('funding').update({ total: newTotal }).eq('id', 1);

            // 画面を最新の金額に更新
            fetchTotal();
            alert("1,000円の支援ありがとうございます！大怪獣のテクスチャ解像度が少し上がりました！");
        }

        // サイトを開いた瞬間に、現在の金額を読み込む
        fetchTotal();
    </script>
</body>
</html>
